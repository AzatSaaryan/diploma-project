[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.7",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "recommended"
include = ["app"]
